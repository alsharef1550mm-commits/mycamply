[build]
  command = "pnpm --filter @workspace/kambley-word-box build"
  publish = "artifacts/kambley-word-box/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/progress"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
